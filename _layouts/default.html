<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>
    {% if page.title == "Home" %}{{ site.title }}{% else %}{{ page.title }} — {{ site.title }}{% endif %}
  </title>
  {% if page.canonical_url %}
  <link rel="canonical" href="{{ page.canonical_url }}">
  {% endif %}
  {% include analytics.html %}
  <link rel="alternate" type="application/rss+xml" title="RSS" href="{{ site.baseurl }}/feed.xml">
  <link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}/public/favicon.svg">
  <link rel="alternate icon" href="{{ site.baseurl }}/favicon.ico">
  <link rel="preload" as="font" type="font/woff2" href="{{ site.baseurl }}/public/fonts/crimsonpro-latin.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="{{ site.baseurl }}/public/fonts/frutiger-67-boldcn.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="{{ site.baseurl }}/public/fonts/figtree-latin.woff2" crossorigin>
  <style>
{% include typography.html %}

    body {
      font-family: var(--serif);
      max-width: var(--measure);
      margin: 60px auto;
      padding: 0 20px;
      line-height: 1.55;
      font-size: 1.25rem;
      color: var(--ink);
      /* Text figures. The Crimson Pro subsets are built with --layout-features+=onum
         specifically for this — Google's stock woff2 subsets strip it. */
      font-variant-numeric: oldstyle-nums;
      text-rendering: optimizeLegibility;
    }
    p { margin: 0 0 1em; }

    /* Links change face rather than carrying a rule: Figtree at the accent colour is
       legible as a link on letterform alone, which is what lets the underline go —
       colour is never the only cue (WCAG 1.4.1). The underline comes back on hover. */
    a {
      font-family: var(--sans);
      font-size: var(--link-size);
      font-weight: var(--link-weight);
      color: var(--accent);
      text-decoration: none;
    }
    a:hover {
      color: var(--accent-deep);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.18em;
    }
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    /* Headings and chrome each set their own face; a link inside one keeps it. */
    h1 a, h2 a, h3 a, h4 a, h5 a, h6 a, .site-nav a, .meta a { font-family: inherit; font-size: inherit; font-weight: inherit; }
    /* Small print keeps the second reduction rather than opting out of it. --link-size
       is a ratio, so it compounds to the same optical result at every size: 0.887 of a
       sidenote's 14.4px is 12.8px, and Figtree's x-height at 12.8px matches the Crimson
       Pro around it to the same 5.6% body links run. This rule used to exempt these
       contexts, which left the sans at the serif's exact px size — where its much taller
       x-height reads about 19% too big, which is what it looked like.
       That exemption made sense when --link-size was 0.82em and compounding landed under
       12px; at 0.887em it doesn't. If --link-size ever drops back (0.82em is the value
       that would put Figtree's caps at parity), check this again — it is the same knob.
       The toggle still inherits: it wraps a <sup>, which is already set down once. */
    .sidenote-toggle { font-size: inherit; }

    h1 {
      font-family: var(--display);
      font-weight: 700;
      font-size: 3.1rem;
      line-height: 1.02;
      letter-spacing: -0.01em;
      margin: 0 0 0.12em;
    }
    h2 {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.55rem;
      line-height: 1.14;
      margin: 2em 0 0.35em;
    }
    h3 {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.2rem;
      line-height: 1.2;
      margin: 1.6em 0 0.3em;
    }

    hr { border: none; border-top: 1px solid var(--rule); margin: 2.2em 0; }
    img { max-width: 100%; height: auto; }
    figure { margin: 1.8em 0; }
    /* The wider measure makes portrait-format images tall enough to push the opening
       paragraph off-screen. Cap the height and centre what's left. */
    figure img {
      max-height: 78vh;
      width: auto;
      display: block;
      margin: 0 auto;
    }
    /* Centred under the image, which is itself centred in the measure — a
       flush-left caption reads as body copy that has lost its indent. */
    figcaption {
      font-size: 0.78em;
      font-style: italic;
      color: var(--quiet);
      margin-top: 0.6em;
      line-height: 1.5;
      text-align: center;
    }
    blockquote {
      border-left: 2px solid var(--rule);
      margin: 1.4em 0;
      padding: 0 1.2em;
      color: #555;
    }

    /* Substack embeds one of its posts inside another as a card of nested divs with
       its own type ramp; none of that CSS exists here, so what arrived was a stack of
       raw links with a 56px logo floating in it. The fetch script now rewrites those
       embeds — and the digest, gallery, tweet and video ones, which shipped as empty
       divs and rendered as nothing at all — into the markup below.
       Same left rule as a blockquote: quoting someone and pointing at their post are
       the same gesture, and the site already has a mark for it. */
    .post-embed {
      display: block;
      border-left: 2px solid var(--rule);
      margin: 1.6em 0;
      padding: 0.15em 1.2em;
    }
    /* The title is the only thing to click, so it gets the line to itself rather than
       sitting inline where it would read as one link among several — which is exactly
       what the unstyled card looked like. */
    .post-embed-title { display: block; line-height: 1.3; }
    .post-embed-excerpt {
      margin: 0.3em 0 0.4em;
      font-size: 0.88em;
      color: #555;
    }
    /* Same pixel face as the post's own meta line, one step down: this is apparatus
       about someone else's post, so it shouldn't out-weigh the page's own byline.
       12px keeps to Silkscreen's 8px grid — 11px and 13px blur. */
    .post-embed-meta {
      font-family: var(--pixel);
      font-size: 12px;
      letter-spacing: 1px;
      -webkit-font-smoothing: none;
      color: var(--quiet);
      line-height: 1.7;
    }
    /* Line breaks only at the separators — see .post-stat, same problem. */
    .post-embed-meta span, .post-embed-meta a { white-space: nowrap; }
    .tweet-embed .post-embed-meta { margin-top: 0.5em; }

    /* A gallery is a swipeable carousel on Substack and a bare div here, so the images
       are stacked instead — at this measure five frames side by side would land each
       one around 120px wide. */
    figure.gallery img + img { margin-top: 0.7em; }

    pre, code { font-family: var(--mono); font-size: 0.8em; }
    pre { overflow-x: auto; padding: 1em; background: #f6f6f6; }

    /* Silkscreen: pixel bitmap, so integer px only and no subpixel tracking, or it blurs.
       a-z are mapped to capital forms, so anything set in it renders all-caps whatever
       the source case. Fine for these two short labels, destroys prose. */
    .site-nav, .meta {
      font-family: var(--pixel);
      /* Silkscreen's grid is 8px, so it stays sharp at even sizes and goes soft at
         odd ones — 11px and 13px visibly blur. 16px is the crispest 2x multiple but
         starts competing with h2. */
      font-size: 14px;
      letter-spacing: 1px;
      -webkit-font-smoothing: none;
    }
    .site-nav { margin-bottom: 3em; }
    .site-nav a { margin-right: 1.6em; color: var(--quiet); text-decoration: none; }
    .site-nav a:hover { color: var(--ink); }
    .meta { color: var(--quiet); margin: 0.7em 0 2.2em; line-height: 1.8; }
    /* Solid-fill icons next to the oldstyle figures: at anything near the
       figures' own size they out-weigh them badly, so they're set well down and
       dropped to the quiet grey rather than picking up the text's ink. */
    .stat-icon { width: 0.78em; height: 0.78em; vertical-align: -0.04em; color: var(--quiet); }
    .post-stat { white-space: nowrap; }

    /* End mark. Crimson Pro has no U+2042, so the glyph comes from a 620-byte
       Cardo subset grafted into the family behind a unicode-range — see
       typography.html. Before that it was drawn by whatever symbol font the
       platform supplied, which is still true of the fleurons (U+2766/7) if they
       ever come back. Decorative, so it's hidden from screen readers in the markup. */
    .endmark {
      text-align: center;
      /* Cardo draws the asterism small inside its em box, so it needs a good deal
         more size than a text mark would to carry at the foot of a page. 2.75rem was
         tuned against a system fallback that drew it larger; at Cardo's proportions
         that lands weedy. */
      font-size: 3.5rem;
      line-height: 1;
      color: #9a9a9a;
      margin: 1.6em 0 0;
      padding-bottom: 4.5rem;
    }

    /* Apparatus stays in the text face — Silkscreen can't set running prose. */
    .footnote {
      font-size: 0.82em;
      color: var(--quiet);
      border-top: 1px solid #eee;
      margin-top: 2.4em;
      padding-top: 1em;
    }

    /* Tufte-style sidenotes */
    .sidenote-toggle { text-decoration: none; }
    .sidenote-toggle sup { color: var(--accent); }
    .sidenote-wrapper { display: inline; }
    .sidenote {
      float: right;
      clear: right;
      width: 200px;
      margin-right: var(--gutter-pull);
      margin-bottom: 1em;
      font-size: 0.72em;
      line-height: 1.45;
      color: var(--quiet);
    }
    .sidenote p { margin: 0; }
    .mobile-footnotes { display: none; }
    .mobile-footnote { font-size: 0.82em; color: var(--quiet); margin: 0.8em 0; }
    /* Below --gutter-min the margin can't hold a sidenote, so fall back to endnotes. */
    @media (max-width: 69.99em) {
      .sidenote { display: none; }
      .mobile-footnotes { display: block; }
    }
  </style>
</head>
<body>
  <nav class="site-nav">
    <a href="/">Henry Stanley</a>
    <a href="/archive">Archive</a>
  </nav>

  {{ content }}

  {% include favicons.html %}
</body>
</html>
