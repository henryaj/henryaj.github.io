<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>
    {% if page.title == "Home" %}{{ site.title }}{% else %}{{ page.title }} — {{ site.title }}{% endif %}
  </title>
  {% if page.canonical_url %}
  <link rel="canonical" href="{{ page.canonical_url }}">
  {% endif %}
  <script data-goatcounter="https://henryaj.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  <link rel="alternate" type="application/rss+xml" title="RSS" href="{{ site.baseurl }}/feed.xml">
  <link rel="shortcut icon" href="{{ site.baseurl }}/public/favicon.ico">
  <link rel="preload" as="font" type="font/woff2" href="{{ site.baseurl }}/public/fonts/ebgaramond-latin.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="{{ site.baseurl }}/public/fonts/frutiger-67-boldcn.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="{{ site.baseurl }}/public/fonts/plexsans-400.woff2" crossorigin>
  <style>
{% include typography.html %}

    body {
      font-family: var(--serif);
      max-width: var(--measure);
      margin: 60px auto;
      padding: 0 20px;
      line-height: 1.55;
      font-size: 1.25rem;
      color: var(--ink);
      /* Text figures. The EB Garamond subsets are built with --layout-features+=onum
         specifically for this — Google's stock woff2 subsets strip it. */
      font-variant-numeric: oldstyle-nums;
      text-rendering: optimizeLegibility;
    }
    p { margin: 0 0 1em; }

    /* Links change face rather than carrying a rule: Plex Sans at the accent colour is
       legible as a link on letterform alone, which is what lets the underline go —
       colour is never the only cue (WCAG 1.4.1). The underline comes back on hover. */
    a {
      font-family: var(--sans);
      font-size: var(--link-size);
      color: var(--accent);
      text-decoration: none;
    }
    a:hover {
      color: var(--accent-deep);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.18em;
    }
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    /* Headings and chrome each set their own face; a link inside one keeps it. */
    h1 a, h2 a, h3 a, h4 a, h5 a, h6 a, .site-nav a, .meta a { font-family: inherit; font-size: inherit; }
    /* --link-size is an em, so in contexts that are already set down it compounds:
       0.82 of 0.72 lands under 12px. Small print keeps the sans face but not the
       second reduction. */
    .footnote a, .mobile-footnote a, .sidenote a, figcaption a, .sidenote-toggle { font-size: inherit; }

    h1 {
      font-family: var(--display);
      font-weight: 700;
      font-size: 3.1rem;
      line-height: 1.02;
      letter-spacing: -0.01em;
      margin: 0 0 0.12em;
    }
    h2 {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.55rem;
      line-height: 1.14;
      margin: 2em 0 0.35em;
    }
    h3 {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.2rem;
      line-height: 1.2;
      margin: 1.6em 0 0.3em;
    }

    hr { border: none; border-top: 1px solid var(--rule); margin: 2.2em 0; }
    img { max-width: 100%; height: auto; }
    figure { margin: 1.8em 0; }
    /* The wider measure makes portrait-format images tall enough to push the opening
       paragraph off-screen. Cap the height and centre what's left. */
    figure img {
      max-height: 78vh;
      width: auto;
      display: block;
      margin: 0 auto;
    }
    figcaption {
      font-size: 0.78em;
      font-style: italic;
      color: var(--quiet);
      margin-top: 0.6em;
      line-height: 1.5;
    }
    blockquote {
      border-left: 2px solid var(--rule);
      margin: 1.4em 0;
      padding: 0 1.2em;
      color: #555;
    }
    pre, code { font-family: var(--mono); font-size: 0.8em; }
    pre { overflow-x: auto; padding: 1em; background: #f6f6f6; }

    /* Silkscreen: pixel bitmap, so integer px only and no subpixel tracking, or it blurs.
       a-z are mapped to capital forms, so anything set in it renders all-caps whatever
       the source case. Fine for these two short labels, destroys prose. */
    .site-nav, .meta {
      font-family: var(--pixel);
      /* Silkscreen's grid is 8px, so it stays sharp at even sizes and goes soft at
         odd ones — 11px and 13px visibly blur. 16px is the crispest 2x multiple but
         starts competing with h2. */
      font-size: 14px;
      letter-spacing: 1px;
      -webkit-font-smoothing: none;
    }
    .site-nav { margin-bottom: 3em; }
    .site-nav a { margin-right: 1.6em; color: var(--quiet); text-decoration: none; }
    .site-nav a:hover { color: var(--ink); }
    .meta { color: var(--quiet); margin: 0.7em 0 2.2em; line-height: 1.8; }
    /* Solid-fill icons next to Garamond's oldstyle figures: at anything near the
       figures' own size they out-weigh them badly, so they're set well down and
       dropped to the quiet grey rather than picking up the text's ink. */
    .stat-icon { width: 0.78em; height: 0.78em; vertical-align: -0.04em; color: var(--quiet); }
    .post-stat { white-space: nowrap; }

    /* End mark. The asterism is one of the few ornaments EB Garamond actually draws —
       the fleurons (U+2766/7) fall back to a system symbol font and render differently
       on every platform. Decorative, so it's hidden from screen readers in the markup. */
    .endmark {
      text-align: center;
      /* Garamond draws the asterism small inside its em box, so it needs a good deal
         more size than a text mark would to carry at the foot of a page. */
      font-size: 2.75rem;
      line-height: 1;
      color: #9a9a9a;
      margin: 1.6em 0 0;
      padding-bottom: 4.5rem;
    }

    /* Apparatus stays in the text face — Silkscreen can't set running prose. */
    .footnote {
      font-size: 0.82em;
      color: var(--quiet);
      border-top: 1px solid #eee;
      margin-top: 2.4em;
      padding-top: 1em;
    }

    /* Tufte-style sidenotes */
    .sidenote-toggle { text-decoration: none; }
    .sidenote-toggle sup { color: var(--accent); }
    .sidenote-wrapper { display: inline; }
    .sidenote {
      float: right;
      clear: right;
      width: 200px;
      margin-right: var(--gutter-pull);
      margin-bottom: 1em;
      font-size: 0.72em;
      line-height: 1.45;
      color: var(--quiet);
    }
    .sidenote p { margin: 0; }
    .mobile-footnotes { display: none; }
    .mobile-footnote { font-size: 0.82em; color: var(--quiet); margin: 0.8em 0; }
    /* Below --gutter-min the margin can't hold a sidenote, so fall back to endnotes. */
    @media (max-width: 69.99em) {
      .sidenote { display: none; }
      .mobile-footnotes { display: block; }
    }
  </style>
</head>
<body>
  <nav class="site-nav">
    <a href="/">Henry Stanley</a>
    <a href="/archive">Archive</a>
  </nav>

  {{ content }}

</body>
</html>
